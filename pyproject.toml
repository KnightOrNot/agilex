[project]
name = "agilex-controller"
version = "0.2.1"
description = "CLI and browser workflows for PiPER-X/GELLO teleoperation and RealSense RGB-D datasets"
readme = "README.md"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [
    { name = "RightOrNot", email = "jue1251665735@outlook.com" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "agilex-gello-software",
    "camera-realsense",
    "numpy>=1.26",
    "pyzmq>=26.0",
]

[project.scripts]
agilex-controller = "agilex_controller.cli:main"
agilex-data-collection = "agilex_data_collection:main"

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.9"]

[tool.uv.sources]
agilex-gello-software = { path = "third-party/agilex-gello-software", editable = true }
camera-realsense = { path = "third-party/camera-realsense-d455f", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: runs the real converter in its separate Python environment"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = ["agilex_controller", "agilex_data_collection"]
