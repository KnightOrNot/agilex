# P2 synthetic devices only; physical HALs are not supported by this entrypoint.
[runtime]

[record]
mode = "full"

[[devices]]
device_id = "front"
kind = "camera"

[[devices]]
device_id = "side"
kind = "camera"

[[devices]]
device_id = "force"
kind = "wrench"

[[streams]]
device_id = "front"
stream = "rgb"
role = "record_required"
monitor_when = ["READY", "ALIGN", "FOLLOWING", "RECORDING"]

[[streams]]
device_id = "front"
stream = "depth"
role = "record_required"
monitor_when = ["READY", "ALIGN", "FOLLOWING", "RECORDING"]

[[streams]]
device_id = "side"
stream = "rgb"
role = "record_required"
monitor_when = ["READY", "ALIGN", "FOLLOWING", "RECORDING"]

[[streams]]
device_id = "side"
stream = "depth"
role = "record_required"
monitor_when = ["READY", "ALIGN", "FOLLOWING", "RECORDING"]

[[streams]]
device_id = "force"
stream = "wrench"
role = "record_required"
monitor_when = ["READY", "ALIGN", "FOLLOWING", "RECORDING"]
